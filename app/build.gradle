plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ankiflow.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.ankiflow.mobile"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.4.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
